<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2a1210">
    <title>Papa Rolly's Rush</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2a1210;
        touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh;
        display: block; background: #2a1210; outline: none; }
      #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 3vh; background: radial-gradient(circle at 50% 40%, #7a1f2b 0%, #2a1210 75%);
        color: #fff3dc; font-family: "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; z-index: 2;
        transition: opacity .4s ease; }
      #loader.done { opacity: 0; pointer-events: none; }
      #logo { width: min(70vw, 720px); max-height: 42vh; object-fit: contain;
        filter: drop-shadow(0 8px 0 rgba(0,0,0,.35)); animation: bob 1.6s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-10px) rotate(1deg); } }
      #bar { width: min(60vw, 460px); height: 26px; border: 5px solid #1e0a08; border-radius: 20px;
        background: #fff3dc; overflow: hidden; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
      #fill { height: 100%; width: 4%; background: linear-gradient(#ffcf4d, #f2a122); border-right: 4px solid #1e0a08;
        transition: width .25s ease; }
      #msg { font-size: clamp(18px, 3vh, 30px); font-weight: 900; letter-spacing: 1px; text-shadow: 0 3px 0 #1e0a08; }
      #rotate { position: fixed; inset: 0; display: none; z-index: 3; background: #2a1210; color: #fff3dc;
        align-items: center; justify-content: center; flex-direction: column; gap: 24px; text-align: center;
        font-family: "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; font-size: 7vw; font-weight: 900; }
      #rotate .phone { width: 22vw; height: 36vw; border: 1.6vw solid #fff3dc; border-radius: 4vw;
        animation: turn 2s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (max-width: 1100px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader">
      <img id="logo" src="TemplateData/logo.png" alt="Papa Rolly's Rush">
      <div id="bar"><div id="fill"></div></div>
      <div id="msg">Warming up the oven...</div>
    </div>
    <div id="rotate"><div class="phone"></div><div>Turn your tablet sideways!</div></div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      var msgs = ["Warming up the oven...", "Tossing the dough...", "Boiling the pasta...", "Squeezing lemons...", "Waxing the moustache..."];
      var fill = document.getElementById("fill"), msg = document.getElementById("msg"), mi = 0;
      var ticker = setInterval(function () { mi = (mi + 1) % msgs.length; msg.textContent = msgs[mi]; }, 1400);

      // Cap the render resolution: tablets have 2-3x DPR which would tank the frame rate.
      var dpr = Math.min(window.devicePixelRatio || 1, 1.5);

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Papa Rolly's",
        productName: "Papa Rolly's Rush",
        productVersion: "0.1.0",
        devicePixelRatio: dpr,
      }, function (progress) {
        fill.style.width = Math.max(4, progress * 100) + "%";
      }).then(function (unityInstance) {
        clearInterval(ticker);
        fill.style.width = "100%";
        document.getElementById("loader").classList.add("done");
        window.unityInstance = unityInstance;
      }).catch(function (message) {
        clearInterval(ticker);
        msg.textContent = "Oops! Please reload the page.";
        console.error(message);
      });
    </script>
  </body>
</html>
